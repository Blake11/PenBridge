<?xml version="1.0" encoding="UTF-8"?>
<!--
  PenBridge menu-bar glyph, state "connected" (issue #101): a phone is connected. The mark + a filled dot badge (top right).
  Master for src/PenBridge.Mac/Resources/Assets.xcassets/MenuBarConnected.imageset (scripts/gen-icons.sh copies it
  there; the asset catalog keeps the vector data and the app shows it as a template image).

  18 x 18 pt, black on transparent: macOS uses only the alpha (template image) and tints it for the
  light/dark menu bar. The <g id="glyph"> group is the mark reduced for 16-18 pt and must be identical in all
  four menubar-*.svg files (the generator checks it). Its screen outline is open at x 10.5..14.25 where the
  stroke crosses the top edge (the stroke's outline widened by 0.8, as in mark.svg).
  No <mask>: CoreSVG rasterises masks at the intrinsic 18 px, which blurs them on Retina. Knock-outs are
  even-odd clip paths, cut-outs are even-odd fills; both stay vector.
  The dot keeps at least 1.1 pt clear of the stroke, so it needs no knock-out.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18">
  <g id="glyph">
    <g fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1.75" y="7.5" width="4.5" height="8.75" rx="1.1"/>
      <path stroke-linecap="butt" d="M14.25 9.75H15.25A1 1 0 0 1 16.25 10.75V13.75A1 1 0 0 1 15.25 14.75H9.75A1 1 0 0 1 8.75 13.75V10.75A1 1 0 0 1 9.75 9.75H10.5"/>
      <path stroke-width="1.3" d="M10.75 16.75H14.25"/>
    </g>
    <g fill="#000">
      <path d="M3.1 9.6H4.9L4 12.4Z"/>
      <path d="M4.35 5.9L4.38 5.31L4.48 4.76L4.62 4.28L4.82 3.85L5.05 3.48L5.32 3.17L5.62 2.92L5.93 2.72L6.26 2.59L6.6 2.51L6.95 2.49L7.3 2.52L7.66 2.61L8.01 2.75L8.37 2.95L8.72 3.21L9.07 3.53L9.42 3.93L9.75 4.39L10.07 4.92L10.36 5.54L10.64 6.23L10.88 7.01L11.09 7.87L11.26 8.83L11.39 9.87L11.47 11.01L11.5 12.25L13.5 12.25L13.46 10.91L13.36 9.67L13.19 8.51L12.97 7.44L12.69 6.46L12.36 5.57L11.98 4.76L11.56 4.04L11.11 3.4L10.63 2.85L10.12 2.38L9.58 2L9.04 1.7L8.49 1.49L7.93 1.36L7.39 1.31L6.86 1.35L6.35 1.46L5.88 1.65L5.44 1.9L5.04 2.22L4.69 2.6L4.38 3.03L4.12 3.51L3.92 4.04L3.77 4.61L3.68 5.23L3.65 5.9A0.35 0.35 0 0 0 4.35 5.9Z"/>
      <circle cx="12.5" cy="12.25" r="1.2"/>
    </g>
  </g>
  <circle cx="15.2" cy="3" r="2.5" fill="#000"/>
</svg>

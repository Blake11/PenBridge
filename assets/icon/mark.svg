<?xml version="1.0" encoding="UTF-8"?>
<!--
  PenBridge mark, concept A "Two shores" (issue #101). Master: every platform icon is generated from it
  by scripts/gen-icons.sh (Android adaptive foreground + themed monochrome layer, macOS Icon Composer layers).

  The S Pen nib draws on the phone (left); its pressure stroke bridges over to the Mac screen (right)
  and lands as the cursor dot.

  Canvas: 1024 x 1024, transparent, laid out for the Android adaptive-icon foreground (1024 = 108 dp;
  the launcher shows the central 72 dp, the mark stays inside the 66 dp safe circle). The macOS icon
  crops the same artwork to viewBox 130.5 130.5 763 763, the way the concept's tile scaled it.

  Palette (Material 3, the Android theme's seed): devices #9ECAFF (pb_primary), ink #F2F8FF.
  The background lives in background.svg.

  Subset rule: scripts/lib/gen-icons.cs converts this file to Android VectorDrawables, so use only
  <g> (transform: translate/scale), <path>, <rect> (rx), <circle>, solid fill/stroke colours,
  stroke-width/linecap/linejoin. No masks, filters, clip paths, text or CSS.

  The gap where the stroke crosses the screen's top edge is geometry, not a mask: the screen outline
  is an open path from x=659 round to x=562 (butt caps). That is the arc's outline widened by 20 on
  each side where it crosses the edge (y 465..495), as the concept's mask had it. Move the arc and
  you must move the gap too.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <g transform="translate(512 512) scale(0.93) translate(-520 -440)">
    <g id="devices" fill="none" stroke="#9ECAFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
      <!-- Phone. -->
      <rect x="276" y="440" width="120" height="250" rx="28"/>
      <!-- Mac screen, open at the top where the stroke passes through. -->
      <path stroke-linecap="butt" d="M659 480H736A24 24 0 0 1 760 504V636A24 24 0 0 1 736 660H494A24 24 0 0 1 470 636V504A24 24 0 0 1 494 480H562"/>
      <!-- Stand. -->
      <path d="M615 664V700M565 704H665"/>
    </g>
    <g id="ink" fill="#F2F8FF">
      <!-- S Pen nib on the phone screen. -->
      <path d="M310 510H362V526Q362 558 336 602Q310 558 310 526Z"/>
      <!-- Pressure stroke: a cubic from (336,392) over (336,150),(615,150) to (615,570), width easing 12 -> 54. -->
      <path d="M342 392L343.1 367.5L346.3 345L351.3 324.6L358.1 306.3L366.3 290.2L375.8 276.5L386.3 265.1L397.6 256L409.4 249.3L421.5 244.8L433.7 242.6L446 242.5L458.3 244.4L470.5 248.5L482.6 254.6L494.7 262.9L506.5 273.5L518.1 286.6L529.3 302.1L540 320.2L550 341.1L559.1 364.8L567.3 391.3L574.3 420.9L580.1 453.4L584.4 489.1L587.1 527.9L588 570L642 570L640.8 525.3L637.5 483.6L632.1 445.1L624.8 409.5L615.7 377L605 347.4L592.8 320.8L579.4 297.2L564.8 276.4L549.2 258.7L532.8 243.8L515.7 231.9L498.2 223L480.5 217L462.9 214L445.6 214L429 216.7L413.2 222L398.5 229.9L385 240L372.9 252.3L362.1 266.6L352.7 282.8L344.8 300.9L338.5 320.9L333.9 342.8L331 366.5L330 392A6 6 0 0 0 342 392Z"/>
      <!-- Cursor dot where the stroke lands. -->
      <circle cx="615" cy="570" r="40"/>
    </g>
  </g>
</svg>

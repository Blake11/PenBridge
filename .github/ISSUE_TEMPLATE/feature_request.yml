name: Feature request
description: Suggest an idea or improvement
title: "feat: "
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - Mac server
        - Android app
        - iOS app
        - Protocol / pairing
        - Pen input
        - Gestures
        - Other

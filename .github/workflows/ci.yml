name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-core-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-core-

      - name: Test
        run: >
          dotnet test --project tests/PenBridge.Core.Tests
          -c Release
          --results-directory TestResults

      - name: Build SimClient
        run: dotnet build tools/PenBridge.SimClient -c Release

      # Trimmed (partial + full) SimClient doing a real J-PAKE pairing and a stroke: the
      # BouncyCastle code pairing reaches must survive trimming warning-free (issue #46).
      - name: Trimmed pairing smoke test
        run: scripts/smoke-trimmed-pairing.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: TestResults
          if-no-files-found: ignore

  mac-build:
    name: macOS build
    # The .NET macos/ios workload packs require Xcode 27.0; macos-latest (macos-26) ships
    # only Xcode 26.x. xcode-27 is the hosted image with Xcode 27 (preview label).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/select-xcode

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-mac-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-mac-

      - name: Install macOS workload
        run: dotnet workload install macos

      - name: Toolchain versions
        run: |
          xcodebuild -version
          dotnet --version
          dotnet workload list

      - name: Build
        run: >
          dotnet build src/PenBridge.Mac/PenBridge.Mac.csproj
          -c Release
          -p:CreatePackage=false

      # Debug runs ILLink too (copy mode) and once dropped BouncyCastle from the bundle (issue #46).
      - name: Build (Debug)
        run: dotnet build src/PenBridge.Mac/PenBridge.Mac.csproj -c Debug

      - name: Check app bundles
        run: scripts/check-bundle.sh --mac Release --mac Debug

  android-build:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-android-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-android-

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install Android SDK dependencies
        run: >
          dotnet build src/PenBridge.Android/PenBridge.Android.csproj
          -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:AcceptAndroidSDKLicenses=true

      - name: Build unsigned Release APK
        run: >
          dotnet build src/PenBridge.Android/PenBridge.Android.csproj
          -c Release
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=false

      - name: Check trimmed APK assemblies
        run: scripts/check-bundle.sh --android Release

  ios-build:
    name: iOS build (placeholder)
    # The .NET macos/ios workload packs require Xcode 27.0; macos-latest (macos-26) ships
    # only Xcode 26.x. xcode-27 is the hosted image with Xcode 27 (preview label).
    runs-on: xcode-27
    timeout-minutes: 30
    # The iOS head is a placeholder that is never released, but it is a required
    # check: a broken trim/build here once slipped onto main unnoticed.
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/select-xcode

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-ios-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-ios-

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Toolchain versions
        run: |
          xcodebuild -version
          dotnet --version
          dotnet workload list

      # Simulator build: no provisioning profile or signing identity needed.
      - name: Build (simulator, unsigned)
        run: >
          dotnet build src/PenBridge.iOS/PenBridge.iOS.csproj
          -c Release
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:EnableCodeSigning=false

      - name: Check app bundle
        run: scripts/check-bundle.sh --ios Release

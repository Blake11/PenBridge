name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Full runs (issue #146): every night all jobs except the iOS placeholder; Sundays everything.
  # The iOS job keys off the Sunday cron string, so keep both strings in sync with `changes`.
  schedule:
    - cron: "23 3 * * 1-6"
    - cron: "23 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run. Runs on main (push, schedule, manual) are never
# cancelled: each gets its own group (run_id), because even with cancel-in-progress false a
# shared group cancels a run still waiting behind another one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # Decides which jobs a PR or a push to main can affect (issues #52, #146). The build jobs
  # below skip via job-level `if:` rather than workflow-level `paths:`: a skipped job still
  # reports its check name and branch protection treats "skipped" as passing, whereas a check
  # that never reports blocks the PR forever. Scheduled and manual runs run every job (the
  # weekday nightly skips only the iOS placeholder). The path -> job table lives in
  # CONTRIBUTING.md ("CI jobs"); keep both in sync.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      FILTERED: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    # Unfiltered events (schedule, workflow_dispatch) run every job; the weekday cron skips iOS.
    outputs:
      core: ${{ (github.event_name != 'pull_request' && github.event_name != 'push') || steps.filter.outputs.core == 'true' }}
      mac: ${{ (github.event_name != 'pull_request' && github.event_name != 'push') || steps.filter.outputs.mac == 'true' }}
      android: ${{ (github.event_name != 'pull_request' && github.event_name != 'push') || steps.filter.outputs.android == 'true' }}
      ios: ${{ (github.event_name != 'pull_request' && github.event_name != 'push' && github.event.schedule != '23 3 * * 1-6') || steps.filter.outputs.ios == 'true' }}
    steps:
      # On pull_request the filter lists the PR's files through the API, so it needs no
      # checkout. On push it diffs against the commit before the push with git, so it needs the
      # history (small repo: full clone). A force push whose "before" is gone fails this job,
      # and then every job runs.
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      # Each filter is the full trigger set of one job: infra and core changes run every job
      # except iOS, since every head depends on Core. Paths matching no filter (docs, .claude,
      # LICENSE, issue/PR templates) skip every build job.
      - uses: dorny/paths-filter@v4
        id: filter
        if: env.FILTERED == 'true'
        with:
          filters: |
            infra: &infra
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/**'
              - '.githooks/**'
            core: &core
              - *infra
              - 'src/PenBridge.Core/**'
              - 'tests/**'
              - 'tools/**'
              - 'build/**'
              - '**/Directory.Build.*'
              - '**/Directory.Packages.props'
              - 'global.json'
              - 'PenBridge.slnx'
              - '.editorconfig'
            # The macOS job runs gen-icons.sh --check, so it also covers the icon masters and the
            # Android files the generator writes (a hand edit there would otherwise go unchecked).
            mac:
              - *core
              - 'src/PenBridge.Mac/**'
              - 'assets/icon/**'
              - 'src/PenBridge.Android/Resources/drawable/ic_launcher_*.xml'
              - 'src/PenBridge.Android/Resources/mipmap-anydpi-v26/ic_launcher*.xml'
            android:
              - *core
              - 'src/PenBridge.Android/**'
            # The iOS placeholder is never released: only its own sources, the CI definition, the
            # SDK pin and the bundle check it runs trigger it on a PR or push. Other Core-side
            # breakage still surfaces in the Sunday full run.
            ios:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'global.json'
              - 'scripts/check-bundle.sh'
              - 'src/PenBridge.iOS/**'

  core-tests:
    name: Core tests
    needs: changes
    # Runs if `changes` failed too, so a broken filter can never turn required checks into
    # passing skips.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.core == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-core-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-core-

      - name: Test
        run: >
          dotnet test --project tests/PenBridge.Core.Tests
          -c Release
          --results-directory TestResults

      - name: Build SimClient
        run: dotnet build tools/PenBridge.SimClient -c Release

      # Trimmed (partial + full) SimClient doing a real J-PAKE pairing and a stroke: the
      # BouncyCastle code pairing reaches must survive trimming warning-free (issue #46).
      - name: Trimmed pairing smoke test
        run: scripts/smoke-trimmed-pairing.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-results
          path: TestResults
          if-no-files-found: ignore

  mac-build:
    name: macOS build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.mac == 'true') }}
    # The .NET macos/ios workload packs require Xcode 27.0; macos-latest (macos-26) ships
    # only Xcode 26.x. xcode-27 is the hosted image with Xcode 27 (preview label).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/select-xcode

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-mac-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-mac-

      # Generated icons (Android drawables, Mac AppIcon.icon + MenuBar imagesets) must match the
      # masters in assets/icon (issue #103). Needs actool, not the workload, so it runs first.
      - name: Check generated icons
        run: |
          if ! scripts/gen-icons.sh --check; then
            echo "::error title=gen-icons.sh --check failed::See the log (stale icons: run scripts/gen-icons.sh and commit the result)"
            exit 1
          fi

      - name: Install macOS workload
        uses: ./.github/actions/dotnet-workload
        with:
          workloads: macos
          save: ${{ github.event_name != 'pull_request' }}

      - name: Toolchain versions
        run: |
          xcodebuild -version
          dotnet --version
          dotnet workload list

      # The shipped configuration: PublishAot applies only to `dotnet publish`, which produces the
      # universal NativeAOT app with full trimming (issue #42); trim/AOT warnings are errors.
      - name: Publish Release (NativeAOT)
        run: >
          dotnet publish src/PenBridge.Mac/PenBridge.Mac.csproj
          -c Release
          -p:CreatePackage=false

      # Kept on purpose (issue #146): the Release publish never compiles the `#if DEBUG` code
      # (development secret store, debug logging), and warnings are errors, so this is the only CI
      # compile of it. Debug also runs ILLink (copy mode), which once dropped BouncyCastle from
      # the bundle (issue #46); the Debug app is what scripts/mac-run.sh runs by default.
      - name: Build (Debug)
        run: dotnet build src/PenBridge.Mac/PenBridge.Mac.csproj -c Debug

      # NativeAOT: J-PAKE code compiled into the executable (dSYM symbols, UUID-matched), the ILLink
      # output's reference closure, and the Trimming.Substitutions.xml guard (dlopen stub still only
      # hits NSObject's unread preload fields). Debug: the bundled assemblies. The head pairs, so
      # pairing must be present.
      - name: Check app bundles
        run: scripts/check-bundle.sh --require-pairing --mac Release --mac Debug

  android-build:
    name: Android build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-android-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-android-

      - name: Install Android workload
        uses: ./.github/actions/dotnet-workload
        with:
          workloads: android
          save: ${{ github.event_name != 'pull_request' }}

      - name: Install Android SDK dependencies
        run: >
          dotnet build src/PenBridge.Android/PenBridge.Android.csproj
          -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:AcceptAndroidSDKLicenses=true

      - name: Build unsigned Release APK
        run: >
          dotnet build src/PenBridge.Android/PenBridge.Android.csproj
          -c Release
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=false

      - name: Check trimmed APK assemblies
        run: scripts/check-bundle.sh --android Release

  ios-build:
    name: iOS build (placeholder)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ios == 'true') }}
    # The .NET macos/ios workload packs require Xcode 27.0; macos-latest (macos-26) ships
    # only Xcode 26.x. xcode-27 is the hosted image with Xcode 27 (preview label).
    runs-on: xcode-27
    timeout-minutes: 30
    # The iOS head is a placeholder that is never released, but it is a required
    # check: a broken trim/build here once slipped onto main unnoticed. It runs only for
    # iOS/CI changes, on Sundays and manually; when skipped it still reports (as passing).
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/select-xcode

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-ios-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-ios-

      - name: Install iOS workload
        uses: ./.github/actions/dotnet-workload
        with:
          workloads: ios
          save: ${{ github.event_name != 'pull_request' }}

      - name: Toolchain versions
        run: |
          xcodebuild -version
          dotnet --version
          dotnet workload list

      # Simulator build: no provisioning profile or signing identity needed.
      - name: Build (simulator, unsigned)
        run: >
          dotnet build src/PenBridge.iOS/PenBridge.iOS.csproj
          -c Release
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:EnableCodeSigning=false

      - name: Check app bundle
        run: scripts/check-bundle.sh --ios Release

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # Decides which jobs a PR can affect (issue #52). The build jobs below skip via job-level
  # `if:` rather than workflow-level `paths:`: a skipped job still reports its check name
  # and branch protection treats "skipped" as passing, whereas a check that never reports
  # blocks the PR forever. Pushes to main and manual runs always run everything. The path
  # -> job table lives in CONTRIBUTING.md ("CI jobs"); keep both in sync.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ github.event_name != 'pull_request' || steps.filter.outputs.core == 'true' }}
      mac: ${{ github.event_name != 'pull_request' || steps.filter.outputs.mac == 'true' }}
      android: ${{ github.event_name != 'pull_request' || steps.filter.outputs.android == 'true' }}
      ios: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ios == 'true' }}
    steps:
      # On pull_request the filter lists the PR's files through the API: no checkout needed.
      # Each filter is the full trigger set of one job: infra and core changes run every job,
      # since every head depends on Core. Paths matching no filter (docs, .claude, LICENSE,
      # issue/PR templates) skip every build job.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            infra: &infra
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/**'
              - '.githooks/**'
            core: &core
              - *infra
              - 'src/PenBridge.Core/**'
              - 'tests/**'
              - 'tools/**'
              - 'build/**'
              - '**/Directory.Build.*'
              - '**/Directory.Packages.props'
              - 'global.json'
              - 'PenBridge.slnx'
              - '.editorconfig'
            mac:
              - *core
              - 'src/PenBridge.Mac/**'
            android:
              - *core
              - 'src/PenBridge.Android/**'
            ios:
              - *core
              - 'src/PenBridge.iOS/**'

  core-tests:
    name: Core tests
    needs: changes
    # Runs if `changes` failed too, so a broken filter can never turn required checks into
    # passing skips.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.core == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-core-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-core-

      - name: Test
        run: >
          dotnet test --project tests/PenBridge.Core.Tests
          -c Release
          --results-directory TestResults

      - name: Build SimClient
        run: dotnet build tools/PenBridge.SimClient -c Release

      # Trimmed (partial + full) SimClient doing a real J-PAKE pairing and a stroke: the
      # BouncyCastle code pairing reaches must survive trimming warning-free (issue #46).
      - name: Trimmed pairing smoke test
        run: scripts/smoke-trimmed-pairing.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: TestResults
          if-no-files-found: ignore

  mac-build:
    name: macOS build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.mac == 'true') }}
    # The .NET macos/ios workload packs require Xcode 27.0; macos-latest (macos-26) ships
    # only Xcode 26.x. xcode-27 is the hosted image with Xcode 27 (preview label).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/select-xcode

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-mac-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-mac-

      - name: Install macOS workload
        run: dotnet workload install macos

      - name: Toolchain versions
        run: |
          xcodebuild -version
          dotnet --version
          dotnet workload list

      - name: Build
        run: >
          dotnet build src/PenBridge.Mac/PenBridge.Mac.csproj
          -c Release
          -p:CreatePackage=false

      # Debug runs ILLink too (copy mode) and once dropped BouncyCastle from the bundle (issue #46).
      - name: Build (Debug)
        run: dotnet build src/PenBridge.Mac/PenBridge.Mac.csproj -c Debug

      - name: Check app bundles
        run: scripts/check-bundle.sh --mac Release --mac Debug

  android-build:
    name: Android build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-android-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-android-

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install Android SDK dependencies
        run: >
          dotnet build src/PenBridge.Android/PenBridge.Android.csproj
          -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:AcceptAndroidSDKLicenses=true

      - name: Build unsigned Release APK
        run: >
          dotnet build src/PenBridge.Android/PenBridge.Android.csproj
          -c Release
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=false

      - name: Check trimmed APK assemblies
        run: scripts/check-bundle.sh --android Release

  ios-build:
    name: iOS build (placeholder)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ios == 'true') }}
    # The .NET macos/ios workload packs require Xcode 27.0; macos-latest (macos-26) ships
    # only Xcode 26.x. xcode-27 is the hosted image with Xcode 27 (preview label).
    runs-on: xcode-27
    timeout-minutes: 30
    # The iOS head is a placeholder that is never released, but it is a required
    # check: a broken trim/build here once slipped onto main unnoticed.
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/select-xcode

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-ios-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-ios-

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Toolchain versions
        run: |
          xcodebuild -version
          dotnet --version
          dotnet workload list

      # Simulator build: no provisioning profile or signing identity needed.
      - name: Build (simulator, unsigned)
        run: >
          dotnet build src/PenBridge.iOS/PenBridge.iOS.csproj
          -c Release
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:EnableCodeSigning=false

      - name: Check app bundle
        run: scripts/check-bundle.sh --ios Release

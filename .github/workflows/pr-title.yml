name: PR title

on:
  # pull_request_target so the check also runs for fork PRs; this workflow
  # never checks out or runs PR code.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            docs
            test
            build
            ci
            chore
            style
            revert
          scopes: |
            core
            protocol
            security
            input
            net
            simclient
            mac
            android
            ios
            windows
            ci
            deps
            docs
            spec
            release
          requireScope: false
          # Subject must not start with an uppercase letter.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in "{title}" must start with a lowercase letter.

name: Build release

# Builds the distributable apps and attaches them to a GitHub release.
# - Called by release-please.yml when a release is created (tag given, dry_run false).
# - Run manually as a dry run (the default): builds the release artifacts from the selected
#   ref (or `tag`) and keeps them as workflow artifacts only; no release is touched.
#   `version` stamps a future version (e.g. 1.0.0) so the dry run matches the real assets.
# - Run manually with `tag` and dry_run=false to rebuild and re-upload the assets of an
#   existing release.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to upload assets to (e.g. v1.0.0)
        required: true
        type: string
      dry_run:
        description: Build workflow artifacts only; never upload to a release
        required: false
        type: boolean
        default: false
      version:
        description: Dry run only. Version to stamp instead of Directory.Build.props
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (empty = the selected branch)
        required: false
        type: string
        default: ""
      dry_run:
        description: Dry run. Build workflow artifacts only; never upload to a release
        required: false
        type: boolean
        default: true
      version:
        description: Dry run only. Version to stamp instead of Directory.Build.props (e.g. 1.0.0)
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_code: ${{ steps.v.outputs.version_code }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: v
        name: Resolve version
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ -z "$TAG" ]; then
            echo "::error::A release build (dry_run=false) needs a tag; use dry_run=true to build artifacts only"
            exit 1
          fi
          if [ -n "$VERSION_OVERRIDE" ]; then
            if [ "$DRY_RUN" != "true" ]; then
              echo "::error::'version' is for dry runs only; a release takes its version from the tag"
              exit 1
            fi
            version=$VERSION_OVERRIDE
          else
            version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n1)
            if [ -z "$version" ]; then
              echo "::error::Could not read <Version> from Directory.Build.props"
              exit 1
            fi
            if [ -n "$TAG" ] && [ "v$version" != "$TAG" ]; then
              echo "::error::Tag $TAG does not match Directory.Build.props version $version"
              exit 1
            fi
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version '$version' is not X.Y.Z[-prerelease]"
            exit 1
          fi
          core=${version%%-*}
          IFS=. read -r major minor patch <<< "$core"
          # Android versionCode = major*1000000 + minor*1000 + patch. It grows with the version
          # only while minor and patch stay below 1000; Google Play caps it at 2100000000.
          if [ "$minor" -gt 999 ] || [ "$patch" -gt 999 ] || [ "$major" -gt 2099 ]; then
            echo "::error::Version $version does not fit the Android versionCode scheme"
            exit 1
          fi
          version_code=$(( major * 1000000 + minor * 1000 + patch ))
          publish=false
          if [ "$DRY_RUN" != "true" ]; then publish=true; fi
          {
            echo "version=$version"
            echo "version_code=$version_code"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version (Android versionCode $version_code); upload to release: $publish ${TAG:-}"

  mac:
    name: macOS app (.zip + .dmg)
    needs: version
    # The .NET macos/ios workload packs require the Xcode pinned next to the workload set in
    # .github/toolchain.env; macos-latest (macos-26) ships only Xcode 26.x. xcode-27 is the
    # hosted image with Xcode 27 (preview label).
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NOTARIZE: ${{ vars.MACOS_NOTARIZE == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/select-xcode

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-mac-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-mac-

      - name: Install macOS workload
        uses: ./.github/actions/dotnet-workload
        with:
          workloads: macos
          save: "false"

      - name: Toolchain versions
        run: |
          xcodebuild -version
          dotnet --version
          dotnet workload list

      # PublishAot applies only to `dotnet publish`: the universal NativeAOT app (issue #42).
      - name: Publish Release (NativeAOT)
        run: >
          dotnet publish src/PenBridge.Mac/PenBridge.Mac.csproj
          -c Release
          -p:CreatePackage=false
          -p:EnableCodeSigning=false
          -p:Version="$VERSION"
          -p:ApplicationDisplayVersion="$VERSION"
          -p:ApplicationVersion="$VERSION"

      # Never ship a bundle missing code Core needs, e.g. BouncyCastle for pairing (issues #46, #42).
      - name: Check app bundle
        run: scripts/check-bundle.sh --require-pairing --mac Release

      - name: Locate app bundle
        run: |
          # The universal bundle; the per-RID ones under osx-arm64/ and osx-x64/ are intermediates.
          app=src/PenBridge.Mac/bin/Release/net10.0-macos/PenBridge.app
          if [ ! -d "$app" ]; then
            echo "::error::$app not found"
            exit 1
          fi
          mkdir -p dist/stage
          ditto "$app" dist/stage/PenBridge.app
          echo "APP=dist/stage/PenBridge.app" >> "$GITHUB_ENV"
          shown=$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")
          if [ "$shown" != "$VERSION" ]; then
            echo "::error::Info.plist CFBundleShortVersionString is '$shown', expected '$VERSION'"
            exit 1
          fi

      # ---- Developer ID signing + notarization (off until vars.MACOS_NOTARIZE == 'true') ----
      - name: Import Developer ID certificate
        if: env.NOTARIZE == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain"
          # Prepend the signing keychain to the user search list, keeping the existing ones.
          existing=$(security list-keychains -d user | tr -d '"' | xargs)
          # shellcheck disable=SC2086 # word splitting of the keychain list is intended
          security list-keychains -d user -s "$keychain" $existing
          rm -f "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n1)
          if [ -z "$identity" ]; then
            echo "::error::No 'Developer ID Application' identity in MACOS_CERT_P12"
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      # scripts/mac-sign.sh signs each Contents/MonoBundle native library before the bundle:
      # the build invalidates their vendor signature and `codesign --deep` skips MonoBundle.
      # No entitlements: Entitlements.plist only grants allow-jit for CoreCLR, and NativeAOT never JITs.
      - name: Sign (Developer ID, hardened runtime)
        if: env.NOTARIZE == 'true'
        run: |
          scripts/mac-sign.sh --hardened --no-entitlements "$APP" "$SIGN_IDENTITY"
          codesign --verify --strict --verbose=2 "$APP"

      # ---- Default: ad-hoc signature (no paid Apple account) ----
      - name: Sign (ad-hoc)
        if: env.NOTARIZE != 'true'
        run: |
          scripts/mac-sign.sh --no-entitlements "$APP" -
          codesign --verify --strict --verbose=2 "$APP"

      - name: Create zip
        run: |
          ditto -c -k --keepParent "$APP" "dist/PenBridge-$VERSION-macos.zip"

      - name: Create dmg
        run: |
          ln -s /Applications dist/stage/Applications
          hdiutil create \
            -volname "PenBridge $VERSION" \
            -srcfolder dist/stage \
            -ov -format UDZO \
            "dist/PenBridge-$VERSION-macos.dmg"
          rm dist/stage/Applications

      - name: Notarize and staple
        if: env.NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          codesign --force --timestamp -s "$SIGN_IDENTITY" "dist/PenBridge-$VERSION-macos.dmg"
          xcrun notarytool submit "dist/PenBridge-$VERSION-macos.dmg" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "dist/PenBridge-$VERSION-macos.dmg"
          # Staple the app too and rebuild the zip so both assets carry the ticket.
          xcrun stapler staple "$APP"
          rm "dist/PenBridge-$VERSION-macos.zip"
          ditto -c -k --keepParent "$APP" "dist/PenBridge-$VERSION-macos.zip"

      - name: Clean up keychain
        if: always() && env.NOTARIZE == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Summary
        working-directory: dist
        run: |
          {
            echo "### macOS $VERSION"
            echo '```'
            shasum -a 256 -- *.zip *.dmg
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: release-mac
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  android:
    name: Android APK (release-signed)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_CODE: ${{ needs.version.outputs.version_code }}
      PUBLISH: ${{ needs.version.outputs.publish }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-android-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-android-

      - name: Install Android workload
        uses: ./.github/actions/dotnet-workload
        with:
          workloads: android
          save: "false"

      - name: Install Android SDK dependencies
        run: >
          dotnet build src/PenBridge.Android/PenBridge.Android.csproj
          -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:AcceptAndroidSDKLicenses=true

      - name: Check signing secrets
        run: |
          if [ "$HAS_KEYSTORE" != "true" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not set; a release APK must be signed. See docs/releasing.md."
              exit 1
            fi
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; building an unsigned APK (artifact only)."
          fi

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/penbridge.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/penbridge.keystore" >> "$GITHUB_ENV"

      - name: Publish Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -- \
            -c Release \
            -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" \
            -p:AndroidPackageFormat=apk \
            -p:Version="$VERSION" \
            -p:ApplicationDisplayVersion="$VERSION" \
            -p:ApplicationVersion="$VERSION_CODE" \
            -o dist/android
          if [ "$HAS_KEYSTORE" = "true" ]; then
            # Passwords are read from the environment (env: prefix) so they never appear on the command line.
            set -- "$@" \
              -p:AndroidKeyStore=true \
              -p:AndroidSigningKeyStore="$KEYSTORE_PATH" \
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
              -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD \
              -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
          else
            set -- "$@" -p:AndroidKeyStore=false
          fi
          dotnet publish src/PenBridge.Android/PenBridge.Android.csproj "$@"

      - name: Check trimmed APK assemblies
        run: scripts/check-bundle.sh --android Release

      - name: Collect APK
        run: |
          # The build emits <package>.apk (unsigned) and <package>-Signed.apk (release keystore,
          # or the debug keystore when AndroidKeyStore=false). Pick by name, never by file order.
          if [ "$HAS_KEYSTORE" = "true" ]; then
            apks=$(find dist/android -type f -name '*-Signed.apk' | sort)
          else
            apks=$(find dist/android -type f -name '*.apk' ! -name '*-Signed.apk' | sort)
          fi
          count=$(printf '%s' "$apks" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one matching APK in dist/android, found $count:"
            find dist/android -type f -name '*.apk'
            exit 1
          fi
          apk=$apks
          suffix=""
          [ "$HAS_KEYSTORE" = "true" ] || suffix="-unsigned"
          mkdir -p dist/out
          cp "$apk" "dist/out/PenBridge-$VERSION-android$suffix.apk"
          echo "APK=dist/out/PenBridge-$VERSION-android$suffix.apk" >> "$GITHUB_ENV"

      # Never ship a debug-keystore APK: a release-signed update can't install over it.
      - name: Verify APK signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          build_tools=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          if [ -z "$build_tools" ] || [ ! -x "$build_tools/apksigner" ]; then
            echo "::error::apksigner not found under $ANDROID_SDK_ROOT/build-tools"
            exit 1
          fi
          "$build_tools/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          if grep -q 'CN=Android Debug' "$RUNNER_TEMP/apksigner.txt"; then
            echo "::error::$APK is signed with the Android debug keystore"
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "### Android $VERSION (versionCode $VERSION_CODE)"
            echo '```'
            sha256sum -- "$APK"
            if [ -f "$RUNNER_TEMP/apksigner.txt" ]; then
              grep -E 'certificate (DN|SHA-256 digest)' "$RUNNER_TEMP/apksigner.txt" || true
            else
              echo "unsigned (no ANDROID_KEYSTORE_BASE64)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/penbridge.keystore"

      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist/out/*.apk
          if-no-files-found: error

  publish:
    name: Upload to GitHub release
    needs: [version, mac, android]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"

name: Install .NET workloads (cached)
description: >
  Installs .NET workloads with a cache, at the workload set pinned in
  .github/toolchain.env. Run it after actions/setup-dotnet (and
  select-xcode on macOS). The cache holds only the files that
  `dotnet workload install` added under DOTNET_ROOT (packs, manifests, the
  workload set, install records), captured by listing DOTNET_ROOT before and
  after the install. The key covers the runner OS and arch, the selected Xcode,
  the exact SDK version and the pinned workload set, so a new SDK,
  workload set or Xcode is a cache miss. The install pins that same workload
  set (`--version`), so a hit and a miss give the same packs. If the pinned workload
  set is missing or malformed, it fails hard. After a restore it checks
  `dotnet workload list` and installs normally if anything is missing. Each
  save gets a unique key (base key plus run id) and a restore takes the newest
  entry under the base key, so a bad entry heals: the run that rejects it
  installs normally and saves a fresh entry that later runs pick up.

inputs:
  workloads:
    description: Space-separated workload IDs (for example "macos" or "android")
    required: true
  save:
    description: >
      "true" saves the cache after a miss. Pass false on pull_request: caches
      saved on a PR ref are visible only to that PR, so they would only use
      storage. Runs on main (push, schedule) refresh the cache for every PR.
    required: false
    default: "true"

  exclude:
    description: >
      Space-separated tar patterns (relative to DOTNET_ROOT, starting with "./") left out of
      the cache archive, for packs no build here uses. The archive size is the restore time:
      the Android packs are 3 GB unpacked and a full archive restored no faster than the
      install itself. A build that does need an excluded pack fails with a missing-pack error.
      A non-empty list gets its own cache key (suffix -slim).
      GNU tar only (Linux runners).
    required: false
    default: ""

outputs:
  cache-hit:
    description: '"true" when the workloads came from the cache'
    value: ${{ steps.extract.outputs.ok == 'true' }}

runs:
  using: composite
  steps:
    - name: Plan workload cache
      id: plan
      shell: bash
      env:
        WORKLOADS: ${{ inputs.workloads }}
        EXCLUDE: ${{ inputs.exclude }}
      run: |
        set -euo pipefail
        if [ -z "${DOTNET_ROOT:-}" ] || [ ! -d "$DOTNET_ROOT" ]; then
          echo "::error::DOTNET_ROOT is not set or missing; run actions/setup-dotnet before this action."
          exit 1
        fi
        sdk=$(dotnet --version)
        # The workload set is pinned in .github/toolchain.env (shared with select-xcode), so a new
        # set can never change what main or a release builds with; bumping it is an explicit edit.
        ws=$(sed -n 's/^WORKLOAD_SET=//p' "${GITHUB_WORKSPACE}/.github/toolchain.env" | tr -d '[:space:]')
        if ! printf '%s' "$ws" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
          echo "::error::WORKLOAD_SET in .github/toolchain.env is missing or malformed (got '${ws}')."
          exit 1
        fi
        xcode=none
        if command -v xcodebuild >/dev/null 2>&1; then
          xcode=$(xcodebuild -version 2>/dev/null | awk 'NR==1 {print $2}')
          xcode=${xcode:-none}
        fi
        ids=$(printf '%s' "$WORKLOADS" | tr -s ' ' '+')
        {
          echo "workload-set=$ws"
          echo "base-key=dotnet-workloads-v2-${RUNNER_OS}-${RUNNER_ARCH}-xcode${xcode}-sdk${sdk}-ws${ws}-${ids}${EXCLUDE:+-slim}"
          echo "archive=${RUNNER_TEMP}/dotnet-workloads.tar"
        } >> "$GITHUB_OUTPUT"
        echo "SDK ${sdk}, workload set ${ws}, Xcode ${xcode}"

    - name: Restore workload cache
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.plan.outputs.archive }}
        # Never an exact match: the newest save under the base key wins via restore-keys.
        key: ${{ steps.plan.outputs.base-key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ steps.plan.outputs.base-key }}-

    - name: Unpack cached workloads
      id: extract
      if: steps.restore.outputs.cache-matched-key != ''
      shell: bash
      env:
        WORKLOADS: ${{ inputs.workloads }}
        ARCHIVE: ${{ steps.plan.outputs.archive }}
        WORKLOAD_SET: ${{ steps.plan.outputs.workload-set }}
      run: |
        set -euo pipefail
        if ! tar -xpf "$ARCHIVE" -C "$DOTNET_ROOT"; then
          echo "::warning::Could not unpack the workload cache; installing instead."
          exit 0
        fi
        installed=$(dotnet workload list 2>/dev/null || true)
        if ! printf '%s\n' "$installed" | grep -Fq "Workload version: ${WORKLOAD_SET}"; then
          echo "::warning::The restored workload set is not ${WORKLOAD_SET}; installing instead."
          exit 0
        fi
        for id in $WORKLOADS; do
          if ! printf '%s\n' "$installed" | grep -Eq "^${id}[[:space:]]"; then
            echo "::warning::Workload '${id}' is missing after the cache restore; installing instead."
            exit 0
          fi
        done
        echo "ok=true" >> "$GITHUB_OUTPUT"

    - name: Install workloads
      id: install
      if: steps.extract.outputs.ok != 'true'
      shell: bash
      env:
        WORKLOADS: ${{ inputs.workloads }}
        WORKLOAD_SET: ${{ steps.plan.outputs.workload-set }}
        ARCHIVE: ${{ steps.plan.outputs.archive }}
        EXCLUDE: ${{ inputs.exclude }}
        # Snapshot (and save) on a miss and after a rejected restore, so a bad entry is replaced.
        SNAPSHOT: ${{ inputs.save == 'true' }}
        RESTORED: ${{ steps.restore.outputs.cache-matched-key != '' }}
      run: |
        set -euo pipefail
        list_files() { (cd "$DOTNET_ROOT" && find . \( -type f -o -type l \) | LC_ALL=C sort); }
        before="${RUNNER_TEMP}/dotnet-files-before.txt"
        if [ "$SNAPSHOT" = "true" ]; then
          if [ "$RESTORED" = "true" ] && [ -f "$ARCHIVE" ]; then
            # Files the rejected restore unpacked count as added, so the fresh archive keeps them.
            restored="${RUNNER_TEMP}/dotnet-files-restored.txt"
            { tar -tf "$ARCHIVE" 2>/dev/null || true; } | LC_ALL=C sort -u > "$restored"
            list_files | LC_ALL=C comm -23 - "$restored" > "$before"
          else
            list_files > "$before"
          fi
        fi
        # shellcheck disable=SC2086 # WORKLOADS is a space-separated list of IDs
        dotnet workload install $WORKLOADS --version "$WORKLOAD_SET"
        if [ "$SNAPSHOT" = "true" ]; then
          # New files, plus all install records (some may exist already and only change).
          added="${RUNNER_TEMP}/dotnet-files-added.txt"
          {
            list_files | LC_ALL=C comm -13 "$before" -
            if [ -d "$DOTNET_ROOT/metadata/workloads" ]; then
              (cd "$DOTNET_ROOT" && find ./metadata/workloads \( -type f -o -type l \))
            fi
          } | LC_ALL=C sort -u > "$added"
          excludes=()
          # shellcheck disable=SC2086 # EXCLUDE is a space-separated list of patterns
          for pattern in $EXCLUDE; do excludes+=("--exclude=$pattern"); done
          tar -cf "$ARCHIVE" -C "$DOTNET_ROOT" ${excludes[@]+"${excludes[@]}"} -T "$added"
          echo "Workload cache: $(tar -tf "$ARCHIVE" | wc -l | tr -d ' ') files, $(du -h "$ARCHIVE" | cut -f1)"
          echo "archived=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save workload cache
      if: steps.install.outputs.archived == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.plan.outputs.archive }}
        key: ${{ steps.plan.outputs.base-key }}-${{ github.run_id }}-${{ github.run_attempt }}
